<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekops - Clientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .btn-primary { background: #0f172a; color: white; padding: 0.625rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; }
        .btn-primary:hover { background: #1e293b; }
        .btn-secondary { background: white; color: #0f172a; border: 1px solid #e2e8f0; padding: 0.375rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.75rem; }
        .header { background: white; padding: 1rem; border-bottom: 1px solid #e2e8f0; }
        .logo { font-weight: 700; font-size: 1.125rem; color: #0f172a; }
        table { width: 100%; background: white; border-collapse: collapse; }
        th { background: #f8fafc; padding: 0.75rem; text-align: left; font-weight: 600; font-size: 0.875rem; border-bottom: 1px solid #e2e8f0; }
        td { padding: 0.875rem 0.75rem; border-bottom: 1px solid #e2e8f0; font-size: 0.875rem; }
        .badge { display: inline-block; padding: 0.375rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Seekops</div>
    </div>

    <div style="max-width: 1000px; margin: 2rem auto; padding: 0 1rem;">
        <div style="background: white; padding: 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="font-size: 1.5rem; font-weight: 700; color: #0f172a;">Clientes</h1>
            <button class="btn-primary">+ CREAR CLIENTE</button>
        </div>

        <div style="background: white; overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Contacto</th>
                        <th>Proyectos</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Cliente XYZ</td>
                        <td>contacto@xyz.com</td>
                        <td>3</td>
                        <td><span class="badge badge-active">Activo</span></td>
                        <td><button class="btn-secondary">Editar</button></td>
                    </tr>
                    <tr>
                        <td>Cliente ABC</td>
                        <td>info@abc.com</td>
                        <td>2</td>
                        <td><span class="badge badge-active">Activo</span></td>
                        <td><button class="btn-secondary">Editar</button></td>
                    </tr>
                    <tr>
                        <td>Cliente DEF</td>
                        <td>hello@def.com</td>
                        <td>5</td>
                        <td><span class="badge badge-active">Activo</span></td>
                        <td><button class="btn-secondary">Editar</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="background: white; padding: 1rem; border-top: 1px solid #e2e8f0; font-size: 0.875rem; color: #64748b;">Total: 8 clientes</div>
    </div>
</body>
</html>
