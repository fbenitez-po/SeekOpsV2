services:
  postgres:
    image: postgres:16-alpine
    container_name: seekops-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seekops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    mem_reservation: 256m

  api:
    build:
      context: ./apps/api
    container_name: seekops-api
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seekops
      FRONTEND_URL: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  ui:
    build:
      context: ./apps/ui
    container_name: seekops-ui
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

volumes:
  postgres_data:
