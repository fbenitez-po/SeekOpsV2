<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekops - Todas las horas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .btn-secondary { background: white; color: #0f172a; border: 1px solid #e2e8f0; padding: 0.375rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.75rem; }
        .header { background: white; padding: 1rem; border-bottom: 1px solid #e2e8f0; }
        table { width: 100%; background: white; border-collapse: collapse; }
        th { background: #f8fafc; padding: 0.75rem; text-align: left; font-weight: 600; font-size: 0.875rem; border-bottom: 1px solid #e2e8f0; }
        td { padding: 0.875rem 0.75rem; border-bottom: 1px solid #e2e8f0; font-size: 0.875rem; }
        .badge { display: inline-block; padding: 0.375rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-pending { background: #f3f4f6; color: #374151; }
        .badge-approved { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight: 700; font-size: 1.125rem; color: #0f172a;">Seekops Admin</div>
    </div>

    <div style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 1rem;">Todas las horas del sistema</h1>

        <div style="background: white; overflow-x: auto; border-radius: 0.5rem;">
            <table>
                <thead>
                    <tr>
                        <th>Seeker</th>
                        <th>Proyecto</th>
                        <th>Semana</th>
                        <th>Horas</th>
                        <th>Estado</th>
                        <th>Gestor</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Juan Díaz</td>
                        <td>Proyecto A</td>
                        <td>S50/2024</td>
                        <td>8h</td>
                        <td><span class="badge badge-pending">⏳ Pendiente</span></td>
                        <td>María García</td>
                        <td><button class="btn-secondary" onclick="alert('Ver detalles')">Ver</button></td>
                    </tr>
                    <tr>
                        <td>Carlos López</td>
                        <td>Proyecto B</td>
                        <td>S50/2024</td>
                        <td>6h</td>
                        <td><span class="badge badge-approved">✓ Aprobado</span></td>
                        <td>María García</td>
                        <td><button class="btn-secondary" onclick="alert('Ver detalles')">Ver</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 1rem; color: #64748b; font-size: 0.875rem;">
            <strong>Total pendientes: 7</strong> | <strong>Aprobadas: 156</strong>
        </div>
    </div>
</body>
</html>
