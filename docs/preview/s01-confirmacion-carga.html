<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekops - Confirmación de carga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .btn-primary { background: #0f172a; color: white; padding: 0.625rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer; transition: all 150ms; }
        .btn-primary:hover { background: #1e293b; }
        .btn-secondary { background: white; color: #0f172a; border: 1px solid #e2e8f0; padding: 0.625rem 1.5rem; border-radius: 0.5rem; cursor: pointer; }
        .btn-secondary:hover { background: #f8fafc; }
        .success-icon { width: 64px; height: 64px; background: #d1fae5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
        .table-simple { width: 100%; background: white; border-radius: 0.5rem; overflow: hidden; }
        .table-simple tr { border-bottom: 1px solid #e2e8f0; }
        .table-simple th { background: #f8fafc; padding: 0.75rem; font-weight: 600; text-align: left; }
        .table-simple td { padding: 0.75rem; }
    </style>
</head>
<body>
    <div style="max-width: 500px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 0.5rem; text-align: center;">
        <div class="success-icon">
            <svg class="w-8 h-8 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
        </div>

        <h1 style="font-size: 1.875rem; font-weight: 700; color: #0f172a; margin-bottom: 0.5rem;">¡Carga registrada!</h1>
        <p style="color: #64748b; margin-bottom: 2rem;">Tu registro de horas ha sido guardado exitosamente</p>

        <div class="table-simple" style="margin-bottom: 2rem; text-align: left;">
            <tr>
                <th>Semana</th>
                <td>S50/2024</td>
            </tr>
            <tr>
                <th>Proyecto</th>
                <td>Proyecto A</td>
            </tr>
            <tr>
                <th>Horas</th>
                <td>8h</td>
            </tr>
            <tr>
                <th>Horas extra</th>
                <td>0h</td>
            </tr>
            <tr>
                <th>Estado</th>
                <td><span style="background: #f3f4f6; padding: 0.375rem 0.75rem; border-radius: 9999px; font-size: 0.875rem;">⏳ Pendiente</span></td>
            </tr>
        </div>

        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 0.5rem; padding: 1rem; margin-bottom: 2rem; text-align: left;">
            <p style="color: #1e40af; font-size: 0.875rem;"><strong>Tu carga está pendiente de aprobación.</strong> El gestor la revisará dentro de 24-48 horas.</p>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button class="btn-primary" style="flex: 1;" onclick="window.history.back()">Volver a mis horas</button>
            <button class="btn-secondary" style="flex: 1;" onclick="window.location.href='s01-cargar-horas.html'">Cargar otra</button>
        </div>
    </div>
</body>
</html>
