<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Rechazo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: rgba(0, 0, 0, 0.5); }
        .modal { background: white; border-radius: 0.5rem; width: 90%; max-width: 500px; margin: 10vh auto; padding: 2rem; box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15); }
        .btn-primary { background: #dc2626; color: white; padding: 0.625rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .btn-primary:hover { background: #991b1b; }
        .btn-secondary { background: white; color: #0f172a; border: 1px solid #e2e8f0; padding: 0.625rem 1.5rem; border-radius: 0.5rem; cursor: pointer; }
        .input-base, .textarea-base { background: white; border: 1px solid #e2e8f0; padding: 0.625rem 0.875rem; border-radius: 0.5rem; font-size: 0.875rem; font-family: 'Inter', sans-serif; width: 100%; }
        .input-base:focus, .textarea-base:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); }
        .label-base { display: block; font-weight: 500; font-size: 0.875rem; color: #1e293b; margin-bottom: 0.5rem; }
        .form-section { margin-bottom: 1.5rem; }
        .alert { background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.5rem; }
        .alert-text { color: #991b1b; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="modal">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #dc2626; margin-bottom: 1.5rem;">¿Por qué rechazas esta carga?</h2>

        <div class="alert">
            <div class="alert-text"><strong>⚠️ Atención:</strong> El rechazo es definitivo. El seeker deberá cargar nuevamente.</div>
        </div>

        <form onsubmit="handleSubmit(event)">
            <!-- Motivo -->
            <div class="form-section">
                <label class="label-base">Motivo de rechazo (requerido)</label>
                <select class="input-base" required>
                    <option value="">Selecciona un motivo</option>
                    <option value="1">Proyecto cerrado</option>
                    <option value="2">Datos incorrectos</option>
                    <option value="3">Fuera de periodo</option>
                    <option value="4">No autorizado</option>
                </select>
            </div>

            <!-- Comentario -->
            <div class="form-section">
                <label class="label-base">Explicación (requerido)</label>
                <textarea class="textarea-base" rows="4" placeholder="Explica al seeker por qué se rechaza esta carga..." required></textarea>
            </div>

            <!-- Botones -->
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn-primary" style="flex: 1;">RECHAZAR</button>
                <button type="button" class="btn-secondary" style="flex: 1;" onclick="window.close()">CANCELAR</button>
            </div>
        </form>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            alert('Carga rechazada. Email enviado al seeker con el motivo.');
            window.close();
        }
    </script>
</body>
</html>
