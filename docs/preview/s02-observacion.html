<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Observación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: rgba(0, 0, 0, 0.5); }
        .modal { background: white; border-radius: 0.5rem; width: 90%; max-width: 500px; margin: 10vh auto; padding: 2rem; box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15); }
        .btn-primary { background: #0f172a; color: white; padding: 0.625rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .btn-primary:hover { background: #1e293b; }
        .btn-secondary { background: white; color: #0f172a; border: 1px solid #e2e8f0; padding: 0.625rem 1.5rem; border-radius: 0.5rem; cursor: pointer; }
        .input-base, .textarea-base { background: white; border: 1px solid #e2e8f0; padding: 0.625rem 0.875rem; border-radius: 0.5rem; font-size: 0.875rem; font-family: 'Inter', sans-serif; transition: all 150ms; width: 100%; }
        .input-base:focus, .textarea-base:focus { outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
        .label-base { display: block; font-weight: 500; font-size: 0.875rem; color: #1e293b; margin-bottom: 0.5rem; }
        .form-section { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="modal">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 1.5rem;">¿Por qué observas esta carga?</h2>

        <form onsubmit="handleSubmit(event)">
            <!-- Motivo predefinido -->
            <div class="form-section">
                <label class="label-base">Motivo (requerido)</label>
                <select class="input-base" required>
                    <option value="">Selecciona un motivo</option>
                    <option value="1">Falta documentación</option>
                    <option value="2">Revisar cantidad de horas</option>
                    <option value="3">Verificar con el cliente</option>
                    <option value="4">Detalles faltantes</option>
                </select>
            </div>

            <!-- Comentario adicional -->
            <div class="form-section">
                <label class="label-base">Detalles adicionales (opcional)</label>
                <textarea class="textarea-base" rows="4" placeholder="Agrega cualquier información adicional..."></textarea>
            </div>

            <!-- Botones -->
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn-primary" style="flex: 1;">GUARDAR OBSERVACIÓN</button>
                <button type="button" class="btn-secondary" style="flex: 1;" onclick="window.close()">CANCELAR</button>
            </div>
        </form>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            alert('Observación guardada. Email enviado al seeker.');
            window.close();
        }
    </script>
</body>
</html>
