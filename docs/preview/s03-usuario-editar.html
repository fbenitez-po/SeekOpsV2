<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekops - Editar Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }

        .btn-primary {
            background: #0f172a; color: white; padding: 0.625rem 1rem;
            border-radius: 0.5rem; font-weight: 500; border: none; cursor: pointer;
        }
        .btn-primary:hover { background: #1e293b; }

        .btn-secondary {
            background: white; color: #0f172a; border: 1px solid #e2e8f0;
            padding: 0.625rem 1rem; border-radius: 0.5rem; cursor: pointer;
        }
        .btn-secondary:hover { background: #f8fafc; }

        .form-group { margin-bottom: 1.5rem; }
        .form-label {
            display: block; font-size: 0.875rem; font-weight: 600;
            color: #1e293b; margin-bottom: 0.375rem;
        }
        .form-label .required { color: #ef4444; }

        .form-input, .form-select {
            width: 100%; padding: 0.625rem; border: 1px solid #e2e8f0;
            border-radius: 0.5rem; font-size: 0.875rem; font-family: 'Inter', sans-serif;
        }
        .form-input:focus, .form-select:focus {
            outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }
        .form-input:disabled {
            background: #f8fafc; opacity: 0.6;
        }

        .row-form {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
        }

        @media (max-width: 768px) {
            .row-form { grid-template-columns: 1fr; }
        }

        .section-title {
            font-size: 1.125rem; font-weight: 700;
            color: #0f172a; padding-bottom: 0.75rem;
            border-bottom: 2px solid #e2e8f0; margin: 2rem 0 1.5rem 0;
        }

        .chip {
            display: inline-block; background: #e5e7eb;
            padding: 0.375rem 0.75rem; border-radius: 9999px;
            margin-right: 0.5rem; margin-bottom: 0.5rem; font-size: 0.875rem;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <!-- Volver -->
        <a href="#" class="text-sm text-slate-600 hover:text-slate-900 mb-4 inline-block">← Volver</a>

        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Editar usuario: Juan Pérez</h1>
        </div>

        <!-- Formulario -->
        <form class="bg-white rounded-lg border border-e2e8f0 p-6">
            <!-- INFORMACIÓN PERSONAL -->
            <div class="section-title">Información Personal</div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Correo electrónico (no editable)</label>
                    <input type="email" class="form-input" value="juan@seekglobal.co" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Nombres <span class="required">*</span></label>
                    <input type="text" class="form-input" value="Juan">
                </div>
            </div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Apellidos <span class="required">*</span></label>
                    <input type="text" class="form-input" value="Pérez">
                </div>
                <div class="form-group">
                    <label class="form-label">Número de documento <span class="required">*</span></label>
                    <input type="text" class="form-input" value="12345678">
                </div>
            </div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Puesto <span class="required">*</span></label>
                    <input type="text" class="form-input" value="Developer">
                </div>
                <div class="form-group">
                    <label class="form-label">Celular</label>
                    <input type="tel" class="form-input" placeholder="+5199999999" value="+5165432100">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Avatar</label>
                <div class="flex gap-3 items-center">
                    <div class="w-24 h-24 bg-slate-300 rounded flex items-center justify-center text-white text-2xl font-bold">JP</div>
                    <div class="flex flex-col gap-2">
                        <button type="button" class="btn-secondary">Cambiar</button>
                        <button type="button" class="btn-secondary">Quitar</button>
                    </div>
                </div>
            </div>

            <!-- INFORMACIÓN DE TRABAJO -->
            <div class="section-title">Información de Trabajo</div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Equipo <span class="required">*</span></label>
                    <select class="form-select">
                        <option value="">Seleccionar equipo...</option>
                        <option value="backend" selected>Backend</option>
                        <option value="frontend">Frontend</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Area <span class="required">*</span></label>
                    <select class="form-select">
                        <option value="">Seleccionar area...</option>
                        <option value="development" selected>Development</option>
                        <option value="qa">QA</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Fecha de ingreso <span class="required">*</span></label>
                <input type="date" class="form-input" value="2023-03-15">
            </div>

            <!-- PERMISOS Y ESTADO -->
            <div class="section-title">Permisos y Estado</div>

            <div class="space-y-3 mb-6">
                <div class="flex items-center gap-3">
                    <input type="radio" id="activo-si" name="activo" checked>
                    <label for="activo-si" class="text-sm font-500">Activo</label>
                    <input type="radio" id="activo-no" name="activo">
                    <label for="activo-no" class="text-sm font-500">Inactivo</label>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" id="staff" checked>
                    <label for="staff" class="text-sm font-500">Staff</label>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" id="super-usuario">
                    <label for="super-usuario" class="text-sm font-500">Super usuario</label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Grupos (multi-select)</label>
                <div class="space-y-2">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="grupo-admin" checked>
                        <label for="grupo-admin" class="text-sm">Administradores</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="grupo-seekers" checked>
                        <label for="grupo-seekers" class="text-sm">Seekers</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="grupo-gestores">
                        <label for="grupo-gestores" class="text-sm">Gestores</label>
                    </div>
                </div>
            </div>

            <!-- HISTÓRICO -->
            <div class="section-title">Histórico</div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Registrado</label>
                    <input type="text" class="form-input" value="15/03/2023 10:30" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Actualizado</label>
                    <input type="text" class="form-input" value="22/04/2026 14:15" disabled>
                </div>
            </div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Estado anterior</label>
                    <input type="text" class="form-input" value="Activo" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Fecha desactivación</label>
                    <input type="text" class="form-input" value="—" disabled>
                </div>
            </div>

            <!-- PROYECTOS ASOCIADOS -->
            <div class="section-title">Proyectos Asociados</div>

            <div class="form-group">
                <div class="mb-3">
                    <span class="chip">ProyA</span>
                    <span class="chip">ProyB</span>
                    <button type="button" class="btn-secondary">+ Agregar</button>
                </div>
            </div>

            <!-- USUARIOS ASOCIADOS -->
            <div class="section-title">Usuarios Asociados por Proyecto</div>

            <div class="space-y-3 mb-6">
                <div>
                    <label class="text-sm font-500 text-slate-900">ProyA:</label>
                    <div class="mt-2">
                        <span class="chip">Usuario X</span>
                        <span class="chip">Usuario Y</span>
                        <button type="button" class="btn-secondary text-xs">+ Agregar</button>
                    </div>
                </div>
                <div>
                    <label class="text-sm font-500 text-slate-900">ProyB:</label>
                    <div class="mt-2">
                        <span class="chip">Usuario Z</span>
                        <button type="button" class="btn-secondary text-xs">+ Agregar</button>
                    </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex gap-3 mt-8">
                <button type="submit" class="btn-primary">Guardar</button>
                <button type="button" class="btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
