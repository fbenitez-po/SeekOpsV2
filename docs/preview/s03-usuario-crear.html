<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekops - Crear Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .btn-primary { background: #0f172a; color: white; padding: 0.625rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .btn-primary:hover { background: #1e293b; }
        .btn-secondary { background: white; color: #0f172a; border: 1px solid #e2e8f0; padding: 0.625rem 1rem; border-radius: 0.5rem; cursor: pointer; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.375rem; }
        .form-label .required { color: #ef4444; }
        .form-input { width: 100%; padding: 0.625rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; }
        .form-input:focus { outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
        .row-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 768px) { .row-form { grid-template-columns: 1fr; } }
        .section-title { font-size: 1.125rem; font-weight: 700; color: #0f172a; padding-bottom: 0.75rem; border-bottom: 2px solid #e2e8f0; margin: 2rem 0 1.5rem 0; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <a href="#" class="text-sm text-slate-600 hover:text-slate-900 mb-4 inline-block">← Volver</a>
        <h1 class="text-3xl font-bold text-slate-900 mb-8">Crear usuario</h1>

        <form class="bg-white rounded-lg border border-e2e8f0 p-6">
            <div class="section-title">Información Personal</div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Correo electrónico <span class="required">*</span></label>
                    <input type="email" class="form-input" placeholder="usuario@seekglobal.co">
                </div>
                <div class="form-group">
                    <label class="form-label">Nombres <span class="required">*</span></label>
                    <input type="text" class="form-input" placeholder="Juan">
                </div>
            </div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Apellidos <span class="required">*</span></label>
                    <input type="text" class="form-input" placeholder="Pérez">
                </div>
                <div class="form-group">
                    <label class="form-label">Número de documento <span class="required">*</span></label>
                    <input type="text" class="form-input" placeholder="12345678">
                </div>
            </div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Puesto <span class="required">*</span></label>
                    <input type="text" class="form-input" placeholder="Developer">
                </div>
                <div class="form-group">
                    <label class="form-label">Celular</label>
                    <input type="tel" class="form-input" placeholder="+5199999999">
                </div>
            </div>

            <div class="section-title">Información de Trabajo</div>

            <div class="row-form">
                <div class="form-group">
                    <label class="form-label">Equipo <span class="required">*</span></label>
                    <select class="form-input">
                        <option value="">Seleccionar equipo...</option>
                        <option value="">Backend</option>
                        <option value="">Frontend</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Area <span class="required">*</span></label>
                    <select class="form-input">
                        <option value="">Seleccionar area...</option>
                        <option value="">Development</option>
                        <option value="">QA</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Fecha de ingreso <span class="required">*</span></label>
                <input type="date" class="form-input">
            </div>

            <div class="section-title">Permisos y Grupos</div>

            <div class="form-group">
                <label class="text-sm font-600 text-slate-900 block mb-3">Grupos <span class="required">*</span></label>
                <div class="space-y-2">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="grupo-admin" checked>
                        <label for="grupo-admin" class="text-sm">Administradores</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="grupo-seekers" checked>
                        <label for="grupo-seekers" class="text-sm">Seekers</label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="grupo-gestores">
                        <label for="grupo-gestores" class="text-sm">Gestores</label>
                    </div>
                </div>
            </div>

            <div class="space-y-3 mb-6">
                <div class="flex items-center gap-3">
                    <input type="radio" id="activo-si" name="activo" checked>
                    <label for="activo-si" class="text-sm font-500">Activo</label>
                    <input type="radio" id="activo-no" name="activo">
                    <label for="activo-no" class="text-sm font-500">Inactivo</label>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" id="staff">
                    <label for="staff" class="text-sm font-500">Staff</label>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" id="super-usuario">
                    <label for="super-usuario" class="text-sm font-500">Super usuario</label>
                </div>
            </div>

            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-8">
                <p class="text-xs text-blue-900">
                    <strong>Nota:</strong> Se enviará email con contraseña temporal a <strong>usuario@seekglobal.co</strong>
                </p>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="btn-primary">Crear usuario</button>
                <button type="button" class="btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
